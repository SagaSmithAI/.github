name: Bug report
description: Report a reproducible SagaSmithAI defect
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: layer
    attributes:
      label: Affected layer
      options: [Local Agent Kit, Agent host, Domain MCP, Core, Rules runtime, Skills, Workbench UI, SagaSmith Web, Content Library, Public website, Organization documentation]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Repository and commit or release
      placeholder: sagasmith-dnd @ abc1234
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment and transport
      options: [Local stdio, Local Streamable HTTP, Hosted Web, Not transport-specific]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Remove secrets, commercial content, and private campaign data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, private campaign data, and copyrighted source text.
          required: true
        - label: This is not a security vulnerability requiring private reporting.
          required: true
