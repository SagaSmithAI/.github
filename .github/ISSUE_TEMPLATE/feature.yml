name: Feature proposal
description: Propose a scoped platform capability
title: "[Feature]: "
labels: [enhancement]
body:
  - type: dropdown
    id: surface
    attributes:
      label: Product surface
      options: [Local Agent Kit, Existing MCP client integration, SagaSmith Web, Domain vertical, Shared Core, Content Library, Public website, Organization documentation]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Player, GM, creator, or integrator problem
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Proposed ownership and rule boundary
      description: State which repository owns it and what remains GM judgment.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Observable acceptance criteria
    validations:
      required: true
