name: Sync News to Profile README
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-news-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Fetch latest news from website repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/news
          items=$(gh api "repos/SagaSmithAI/SagaSmithAI.github.io/contents/news?ref=main" --jq '.[] | select(.type == "file" and (.name | endswith(".md"))) | .name')
          if [ -z "$items" ]; then
            echo "No Markdown news files found" >&2
            exit 1
          fi
          while IFS= read -r file; do
            content=$(gh api "repos/SagaSmithAI/SagaSmithAI.github.io/contents/news/$file?ref=main" --jq '.content')
            printf '%s' "$content" | base64 --decode > "/tmp/news/$file"
          done <<< "$items"
          find /tmp/news -maxdepth 1 -type f -name '*.md' -printf '%f\n' | sort

      - name: Update README
        run: python3 scripts/render_profile_news.py profile/README.md /tmp/news --limit 3

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/README.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: sync news $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes"
          fi
